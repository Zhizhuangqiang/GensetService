services:
  - type: web
    name: maintenance-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
